<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新标签页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wallpaper" class="wallpaper-container"></div>

    <div class="top-right-controls">
        <button id="wallpaper-settings-btn" class="control-btn" title="壁纸设置">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </button>
        <button id="settings-btn" class="control-btn" title="设置">
            <svg t="1750566206378" width="24" height="24" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="9777" width="200" height="200"><path d="M637.461333 81.344a213.333333 213.333333 0 0 1 184.746667 106.666667L947.690667 405.333333a213.333333 213.333333 0 0 1 0 213.333334L822.186667 835.989333a213.333333 213.333333 0 0 1-184.746667 106.666667H386.56a213.333333 213.333333 0 0 1-184.746667-106.666667L76.309333 618.666667a213.333333 213.333333 0 0 1 0-213.333334L201.813333 188.010667a213.333333 213.333333 0 0 1 184.746667-106.666667z m0 85.333333H386.56a128 128 0 0 0-110.848 64L150.186667 448a128 128 0 0 0 0 128l125.482666 217.322667a128 128 0 0 0 110.848 64H637.44a128 128 0 0 0 110.848-64L873.813333 576a128 128 0 0 0 0-128l-125.482666-217.322667a128 128 0 0 0-110.848-64zM519.850667 362.666667c30.741333 0 53.888 4.992 75.285333 16.426666a120.192 120.192 0 0 1 49.749333 49.770667c11.456 21.397333 16.448 44.544 16.448 75.285333v15.701334c0 30.741333-4.992 53.888-16.426666 75.285333a120.192 120.192 0 0 1-49.770667 49.749333c-21.397333 11.456-44.544 16.448-75.285333 16.448h-15.701334c-30.741333 0-53.888-4.992-75.285333-16.426666a120.192 120.192 0 0 1-49.749333-49.770667c-11.456-21.397333-16.448-44.544-16.448-75.285333v-15.701334c0-30.741333 4.992-53.888 16.426666-75.285333a120.192 120.192 0 0 1 49.770667-49.749333c21.397333-11.456 44.544-16.448 75.285333-16.448z m0 85.333333h-15.701334c-17.514667 0-26.986667 2.048-35.029333 6.357333-6.485333 3.456-11.306667 8.277333-14.762667 14.762667-4.309333 8.042667-6.357333 17.493333-6.357333 35.029333v15.701334c0 17.514667 2.048 26.986667 6.357333 35.029333 3.456 6.485333 8.277333 11.306667 14.762667 14.762667 8.042667 4.309333 17.493333 6.357333 35.029333 6.357333h15.701334c17.514667 0 26.986667-2.048 35.029333-6.357333 6.485333-3.456 11.306667-8.277333 14.762667-14.762667 4.309333-8.042667 6.357333-17.493333 6.357333-35.029333v-15.701334c0-17.514667-2.048-26.986667-6.357333-35.029333a34.88 34.88         </button>
        </div>
        
    <main class="main-container">
        <div class="content-wrapper">
            <div class="search-container">
                <div class="search-bar">
                    <div id="search-engine-selector" class="search-engine-selector">
                        <div id="selected-engine" class="selected-engine">
                            <!-- 当前搜索引擎图标和名称将在这里显示 -->
                        </div>
                        <div id="search-engine-dropdown" class="search-engine-dropdown u-hidden">
                            <!-- 搜索引擎列表将动态插入 -->
                        </div>
                    </div>
                    <input type="text" id="search-input" class="search-input" placeholder="搜索..." autocomplete="off">
                    <button class="clear-search-btn" id="clear-search-btn" title="清空"></button>
                    <button type="submit" class="search-submit-btn" id="search-submit-btn" title="搜索"></button>

                    <!-- 搜索历史下拉框 -->
                    <div class="search-history-dropdown u-hidden" id="search-history-dropdown">
                        <!-- 历史记录项将由JS动态生成 -->
                        <div id="history-items-container"></div>
                        <!-- 清空按钮容器 -->
                        <div id="clear-history-container" class="clear-history-container">
                            <button id="clear-all-history-btn" class="clear-all-history-btn">清空搜索记录</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="quick-access-grid" class="quick-access-grid">
                <!-- Quick access items will be populated by JS -->
            </div>
        </div>
    </main>

    <div class="bottom-controls">
        <button id="change-wallpaper-btn" class="control-btn" title="更换壁纸">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        </button>
    </div>

        <script src="js/components/sortable.min.js"></script>
        <script src="js/components/advanced-pagination.js"></script>
        
        <!-- 功能模块 -->
        <script src="js/modules/wallpaper-manager.js"></script>
        <script src="js/modules/search-manager.js"></script>
        <script src="js/modules/quick-access-manager.js"></script>
        <script src="js/modules/settings-manager.js"></script>
        
        <!-- 主应用 -->
        <script src="js/app.js"></script>
        <script src="main.js"></script>

    <!-- 壁纸设置面板 -->
    <div id="wallpaper-panel" class="settings-panel u-hidden">
        <div class="wallpaper-content settings-content">
            <div id="wallpaper-categories-sidebar" class="wallpaper-categories-sidebar">
                <!-- 分类将动态插入 -->
            </div>
            <div class="wallpaper-main">
                 <div class="wallpaper-header">
                    <h2>壁纸库</h2>
                    <div class="wallpaper-search-box">
                        <input type="text" id="wallpaper-search-input" placeholder="搜索壁纸，例如 'Forest'">
                        <button id="wallpaper-search-btn">搜索</button>
                    </div>
                </div>
                <div id="wallpaper-grid" class="wallpaper-grid">
                    <!-- 壁纸缩略图将显示在这里 -->
                </div>
                <div id="wallpaper-loading" class="wallpaper-loading u-hidden">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">正在加载壁纸...</div>
                </div>
                <div id="wallpaper-pagination" class="wallpaper-pagination">
                    <div id="pagination-buttons" class="pagination-buttons">
                        <!-- 页码按钮将动态插入 -->
                    </div>
                    <div class="pagination-info">
                        <span id="total-results-info"></span>
                        <div class="jump-to-page">
                            <span>跳至</span>
                            <input type="number" id="jump-to-page-input" min="1">
                            <span>页</span>
                        </div>
                    </div>
                </div>
            </div>
            <button id="close-wallpaper-panel-btn" class="close-panel-btn">✕</button>
            </div>
        </div>
        
    <!-- 设置面板 (默认隐藏) -->
    <div id="settings-panel" class="settings-panel u-hidden">
        <div class="settings-content">
            <h2>设置</h2>
            <div class="setting-item">
                <label for="api-key-input">Pexels API 密钥</label>
                <div class="input-with-icon">
                    <input type="password" id="api-key-input" placeholder="在此输入您的密钥">
                    <button id="toggle-api-key-visibility" class="visibility-toggle">
                        <!-- SVG for 'eye-off' will be here -->
            </button>
                </div>
                <p class="api-key-description">
                    从 <a href="https://www.pexels.com/zh-cn/api/documentation/#authorization" target="_blank">Pexels API 文档</a> 获取您的免费密钥。
                </p>
            </div>
            <div class="settings-actions">
                <button id="save-settings-btn" class="settings-btn">保存</button>
                <button id="close-settings-btn" class="settings-btn secondary">关闭</button>
            </div>
        </div>
    </div>
    
    <!-- 删除确认弹窗 (默认隐藏) -->
    <div id="delete-confirm-modal" class="delete-confirm-modal u-hidden">
        <div class="delete-confirm-content">
            <div class="delete-confirm-header">
                <h3>确认删除</h3>
            </div>
            <div class="delete-confirm-body">
                <p id="delete-confirm-text">您确定要删除这个快捷方式吗？</p>
            </div>
            <div class="delete-confirm-footer">
                <button id="delete-confirm-cancel" class="delete-confirm-btn cancel-btn">取消</button>
                <button id="delete-confirm-delete" class="delete-confirm-btn delete-btn">删除</button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑快捷方式面板 (默认隐藏) -->
    <div id="add-quick-access-panel" class="settings-panel u-hidden">
        <div class="settings-content">
            <h2 id="qa-panel-title">添加快捷方式</h2>
            <input type="hidden" id="qa-edit-index" value="-1">
            <div class="setting-item">
                <label for="qa-url-input">链接地址 (URL)</label>
                <input type="text" id="qa-url-input" placeholder="例如: https://www.baidu.com">
                <p id="qa-url-error" class="error-message u-hidden"></p>
            </div>
            <div class="setting-item">
                <label for="qa-name-input">标签名称</label>
                <input type="text" id="qa-name-input" placeholder="例如: Baidu">
                <p id="qa-name-error" class="error-message u-hidden"></p>
            </div>
            <div class="setting-item">
                <div class="label-with-tooltip">
                    <label for="qa-icon-input">自定义图标 (选填)</label>
                    <div class="tooltip-container">
                        <span class="tooltip-icon">i</span>
                        <div class="tooltip-text">
                            推荐前往 <a href="https://www.iconfont.cn/" target="_blank" rel="noopener noreferrer">iconfont.cn</a> 获取SVG代码。
                        </div>
                    </div>
                </div>
                <div class="icon-input-wrapper">
                    <textarea id="qa-icon-input" rows="3" placeholder="粘贴图片URL或SVG代码"></textarea>
                    <div id="qa-icon-preview-container" class="icon-preview-container u-hidden">
                        <span class="preview-label">预览:</span>
                        <div id="qa-icon-preview" class="icon-preview"></div>
                    </div>
                </div>
                <p class="api-key-description">如果留空，将自动获取网站图标。</p>
            </div>
            <div class="settings-actions">
                <button id="save-qa-btn" class="settings-btn">保存</button>
                <button id="cancel-qa-btn" class="settings-btn secondary">取消</button>
            </div>
        </div>
    </div>
</body>
</html>
